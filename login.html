<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | National Internship Portal</title>
    <style>
        :root { --primary-color: #0F2942; --accent-color: #2563EB; --accent-hover: #1D4ED8; --success-color: #059669; --bg-light: #F8FAFC; --card-bg: #FFFFFF; --text-dark: #1E293B; --text-muted: #64748B; --border-color: #E2E8F0; --radius-md: 8px; --radius-lg: 12px; --shadow-lg: 0 10px 25px -5px rgba(0,0,0,0.1); }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg-light); color: var(--text-dark); display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .auth-card { background: var(--card-bg); border-radius: var(--radius-lg); width: 100%; max-width: 420px; padding: 40px; box-shadow: var(--shadow-lg); border: 1px solid var(--border-color); }
        h2 { font-size: 1.6rem; color: var(--primary-color); margin-bottom: 20px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 0.88rem; font-weight: 600; color: var(--text-dark); margin-bottom: 6px; }
        input { width: 100%; padding: 12px 14px; border: 1px solid var(--border-color); border-radius: var(--radius-md); font-size: 0.95rem; }
        input:focus { outline: none; border-color: var(--accent-color); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        .btn { width: 100%; padding: 12px; background-color: var(--accent-color); color: #FFFFFF; border: none; border-radius: var(--radius-md); font-weight: 600; cursor: pointer; transition: background 0.2s; font-size: 1rem; }
        .btn:hover { background-color: var(--accent-hover); }
        .toggle-text { text-align: center; font-size: 0.9rem; margin-top: 20px; color: var(--text-muted); }
        .toggle-text a { color: var(--accent-color); font-weight: 600; }
        .status-message { margin-top: 15px; font-size: 0.9rem; font-weight: 600; text-align: center; }
        .back-home { display: block; text-align: center; margin-top: 15px; font-size: 0.85rem; color: var(--text-muted); }
    </style>
</head>
<body>
    <div class="auth-card">
        <h2>Sign In to Portal</h2>
        <form id="loginForm">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="loginEmail" required placeholder="user@domain.co.ke">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPassword" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn">Sign In</button>
        </form>
        <div id="loginMessage" class="status-message"></div>
        <div class="toggle-text">
            Don't have an account? <a href="register.html">Register here</a>
        </div>
        <a href="index.html" class="back-home">&larr; Back to Home</a>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                email: document.getElementById('loginEmail').value,
                password: document.getElementById('loginPassword').value
            };

            const msgDiv = document.getElementById('loginMessage');
            msgDiv.style.color = "var(--accent-color)";
            msgDiv.innerText = "Authenticating...";

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const result = await response.json();

                if (response.ok) {
                    msgDiv.style.color = "var(--success-color)";
                    msgDiv.innerText = result.message;

                    localStorage.setItem('userRole', result.role);
                    localStorage.setItem('userId', result.userId);
                    if (result.profileId) localStorage.setItem('profileId', result.profileId);

                    setTimeout(() => {
                        if (result.role === 'applicant') window.location.href = 'student.html';
                        else if (result.role === 'employer') window.location.href = 'employer.html';
                        else if (result.role === 'admin') window.location.href = 'admin.html';
                        else window.location.href = 'index.html';
                    }, 600);
                } else {
                    msgDiv.style.color = "#DC2626";
                    msgDiv.innerText = result.error || 'Invalid credentials.';
                }
            } catch (err) {
                msgDiv.style.color = "#DC2626";
                msgDiv.innerText = 'Network error: ' + err.message;
            }
        });
    </script>
</body>
</html>
